<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>프로덕트 디자이너 면접 인덱스</title>
<style>
:root{--bg:#fff;--text:#1a1a1a;--sub:#6b7280;--line:#e5e7eb;--soft:#f6f7f9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:16px;line-height:1.6;color:var(--text);background:var(--bg);
  padding-bottom:calc(40px + env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}

header{padding:28px 0 8px}
h1{margin:0;font-size:28px;letter-spacing:-.02em}
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px}
.search input{
  color:var(--text);
  width:100%;height:52px;border:1.5px solid var(--line);border-radius:14px;
  padding:0 16px;font:inherit;font-size:17px;background:var(--soft);outline:none;
}
.search input:focus{border-color:var(--text);background:#fff}
.tabs{display:flex;gap:8px;margin-top:10px}
.tab{flex:1;height:48px;border-radius:12px;background:var(--soft);font-weight:600;font-size:16px;color:var(--sub)}
.tab.on{background:var(--text);color:#fff}

/* cards */
.card{scroll-margin-top:150px;border:1.5px solid var(--line);border-radius:18px;margin:14px 0;overflow:hidden;background:#fff}
.card-head{width:100%;text-align:left;padding:18px;color:#fff;display:flex;align-items:center;gap:12px;min-height:72px}
.card-head .t{flex:1}
.card-head .t b{display:block;font-size:19px;letter-spacing:-.01em}
.card-head .t span{display:block;font-size:15px;opacity:.92;margin-top:2px;line-height:1.45}
.chev{font-size:18px;transition:transform .2s}
.card.open .chev{transform:rotate(180deg)}
.card-body{display:none;padding:6px 18px 20px}
.card.open .card-body{display:block}
.sec{margin-top:18px}
.sec h3{margin:0 0 8px;font-size:13px;color:var(--sub);font-weight:700;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--soft);border-radius:999px;padding:6px 12px;font-size:15px}
ul.plain{margin:0;padding-left:20px}
ul.plain li{margin:4px 0}
.kpi{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.kpi dt{font-size:14px;font-weight:700;color:var(--sub)}
.kpi dd{margin:0}
.retro{margin:0;background:var(--soft);border-radius:12px;padding:12px 14px}
.step{background:var(--soft);border-radius:12px;padding:10px 14px}
.step ul{margin-top:4px}
.arrow{text-align:center;color:var(--sub);line-height:1.5}
mark{background:#fff2a8;border-radius:3px}
.ansbox{background:var(--soft);border-radius:12px;padding:12px 14px}
.ansbox p{margin:0 0 8px}.ansbox p:last-child{margin:0}
.warn{background:#fdecec;color:#b02a2a;border-radius:12px;padding:12px 14px;font-weight:600}

/* questions */
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;height:40px;padding:0 14px;border-radius:999px;background:var(--soft);font-size:15px;font-weight:600;color:var(--sub)}
.cat.on{background:var(--text);color:#fff}
.block-title{font-size:13px;font-weight:700;color:var(--sub);margin:22px 0 2px;letter-spacing:.04em}
.qlist{list-style:none;margin:0;padding:0}
.qitem{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.qitem:first-child{border-top:0}
.qitem .qt{flex:1}
.qcat{display:inline-block;font-size:12px;font-weight:700;color:var(--sub);background:var(--soft);border-radius:6px;padding:1px 8px;margin-bottom:2px}
.star{width:44px;height:44px;border-radius:12px;font-size:22px;color:#c7cbd1;flex:none}
.star.on{color:#f5a623}
.empty{color:var(--sub);text-align:center;padding:48px 0}

.row{display:flex;gap:8px}
.row button{flex:1;height:56px;border-radius:14px;font-weight:700;font-size:16px;background:var(--soft)}
.row .primary{background:var(--text);color:#fff}

.cats.sm,.cat.sm{height:34px;font-size:14px;padding:0 12px}
.seg{display:flex;gap:6px;background:var(--soft);border-radius:12px;padding:4px;margin:8px 0 10px}
.seg button{flex:1;height:44px;border-radius:9px;font-weight:700;color:var(--sub)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.qitem{align-items:flex-start}
.qitem .star{margin-top:-4px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--sub);background:#fff}
.pill.lv0{background:#eefaf1;border-color:#cdebd6;color:#1f7a3f}
.pill.lv1{background:#fff8e1;border-color:#f3e2a6;color:#8a6a00}
.pill.lv2{background:#fdecec;border-color:#f5c6c6;color:#b02a2a}
.pill.hot{background:#fff4d6;border-color:#f5d98a;color:#8a5a00}
.pill.done{background:#eaf2ff;border-color:#c5d8fb;color:#1f4fb4}
.pill.memo{border-color:var(--text);color:var(--text)}
.pill.ans{border-color:#2f6fed;color:#2f6fed}
.pill.del{color:#b02a2a}
.memoin{color:var(--text);display:block;width:100%;margin-top:8px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;background:var(--soft);resize:vertical}
.qcat.mine{background:#eaf2ff;color:#1f4fb4;margin-left:4px}
.addbtn{width:100%;height:48px;border-radius:12px;border:1.5px dashed var(--line);font-weight:600;color:var(--sub);margin:4px 0 8px}
.addform{border:1.5px solid var(--line);border-radius:16px;padding:14px;margin:4px 0 10px}
.addform label{display:block;font-size:13px;font-weight:700;color:var(--sub);margin:6px 0 4px}
.addform textarea,.addform select,.bigsel{color:var(--text);width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;background:#fff}
.bigsel{height:52px}
.addform .arow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addform .chk{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--text);margin:10px 0}
.addform .row{margin-top:8px}
.row{display:flex;gap:8px;margin-top:14px}
.row button:disabled{opacity:.4}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 14px}
.mode{height:52px;border-radius:12px;background:var(--soft);font-weight:700;color:var(--sub)}
.mode.on{background:var(--text);color:#fff}
.progress{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--text)}
.stepno{font-size:14px;font-weight:700;color:var(--sub);margin:10px 0 6px}
.live{border:1.5px solid var(--line);border-radius:16px;padding:16px;margin:6px 0}
.bigq{font-size:21px;font-weight:700;line-height:1.5;letter-spacing:-.01em}
.livebar{display:flex;align-items:flex-start;gap:6px}
.livebar .metawrap{flex:1}
.metawrap,.qitem .qt{min-width:0}
.follow{padding-left:22px;margin:6px 0}
.follow li{padding:10px 0;font-size:18px;border-top:1px solid var(--line)}
.follow li:first-child{border-top:0}
.bubble{background:#fdecec;border-radius:14px;padding:12px 14px;margin-top:10px;font-weight:600}
.lbl{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:4px}
.ckw{margin:2px 0 6px}
.rel{display:grid;gap:8px;margin-top:6px}
.relcard{display:block;width:100%;text-align:left;border:1.5px solid var(--line);border-left-width:5px;border-radius:12px;padding:10px 14px}
.relcard span{display:block;font-size:14px;color:var(--sub)}
.empty.small{padding:18px 0}
.sub{color:var(--sub);margin:6px 0 10px}
.search input[hidden]{display:none}
::placeholder{color:var(--sub);opacity:.8}
#sync[data-bad]{color:#b02a2a;cursor:pointer;text-decoration:underline}
</style>
<div class="wrap">
  <header><h1>프로덕트 디자이너 면접 인덱스</h1><div id="sync" class="sub" style="font-size:13px;margin:2px 0 0"></div></header>
  <div class="search">
    <input id="q" type="search" placeholder="검색 (예: 키워드, 질문)" autocomplete="off">
    <div class="tabs">
      <button class="tab on" data-tab="cards">카드</button>
      <button class="tab" data-tab="qs">예상 질문</button>
    </div>
  </div>
  <main id="main"></main>
</div>

const $ = s=>document.querySelector(s);

const match = s=>!query || s.toLowerCase().includes(query.toLowerCase());

  const i = query ? s.toLowerCase().indexOf(query.toLowerCase()) : -1;
  if(i<0) return esc(s);
  return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+query.length))+'</mark>'+esc(s.slice(i+query.length));
};
const shuffle=a=>{ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

function metaRow(t,isCustom){
  const lv=getLv(t), hot=getHot(t), d=S.done[t], hasMemo=!!(S.memo[t]||'').trim(), k=esc(t);
  const def=DEF[t], hasAns=!!(def&&def.ans);
  return `<div class="metawrap"><div class="meta">
    <button class="pill lv${lv}" data-lv="${k}">${LVS[lv][0]} ${LVS[lv][1]}</button>
    <button class="pill ${hot?'hot':''}" data-hot="${k}">${hot?'⭐ 자주 나옴':'자주 나옴'}</button>
    <button class="pill ${d?'done':''}" data-done="${k}">${d?'✅ 답변 완료 · '+fmtDate(d):'답변 전'}</button>
    ${hasAns?`<button class="pill ans" data-ans="${k}">💬 답변 예시</button>`:''}

    ${isCustom?`<button class="pill del" data-del="${k}">${delArm===t?'정말 삭제':'🗑 삭제'}</button>`:''}

const cardMatches = c=>!query || [c.title,c.one,...(c.goal||[]),...(c.kpi||[]).flat(),...c.kw,...(c.problem||[]),...flat(c),...(c.extras||[]).flatMap(x=>[x.t,...x.items]),...(c.result||[]),...(c.retro||[]),...(c.ans||[]),c.warn||'',...c.qs].some(match);

/* ---------- 이벤트 ---------- */
const toggle=(arr,t)=>{ const i=arr.indexOf(t); i<0?arr.push(t):arr.splice(i,1); };
function gotoCard(id){
  tab='cards'; query=''; $('#q').value=''; opened.clear(); opened.add(id);
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab==='cards'));
  render();
  const el=document.querySelector(`[data-card="${id}"]`);
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}
document.addEventListener('click',e=>{
  const g=e.target.closest.bind(e.target), d=(sel,key)=>{ const el=g(sel); return el?el.dataset[key]:null; };
  let v;
  if((v=d('[data-toggle]','toggle'))){
    const card=g('[data-toggle]').parentElement;
    if(query) card.classList.toggle('open');
    else{
      const was=opened.has(v); opened.clear(); if(!was) opened.add(v);
      document.querySelectorAll('.card').forEach(el=>el.classList.toggle('open',opened.has(el.dataset.card)));
      if(!was){ const top=card.getBoundingClientRect().top; if(top<150||top>innerHeight*0.6) card.scrollIntoView({behavior:'smooth',block:'start'}); }
    }
    return;
  }
  if((v=d('[data-goto]','goto'))){ gotoCard(v); return; }
  if((v=d('[data-star]','star'))){ toggle(S.favs,v); save(); rr(); return; }
  if((v=d('[data-done]','done'))){ if(S.done[v]) delete S.done[v]; else S.done[v]=Date.now(); save(); rr(); return; }
  if((v=d('[data-memo]','memo'))){ memoOpen.has(v)?memoOpen.delete(v):memoOpen.add(v); rr(); return; }
  if((v=d('[data-ans]','ans'))){ ansOpen.has(v)?ansOpen.delete(v):ansOpen.add(v); rr(); return; }
  if((v=d('[data-lv]','lv'))){ S.lv[v]=(getLv(v)+1)%3; save(); rr(); return; }
  if((v=d('[data-hot]','hot'))){ S.hot[v]=!getHot(v); save(); rr(); return; }
  if((v=d('[data-del]','del'))){
    if(delArm!==v){ delArm=v; rr(); return; }
    S.custom=S.custom.filter(c=>c.text!==v); S.favs=S.favs.filter(t=>t!==v); delete S.done[v]; delete S.memo[v]; delArm=''; save(); rr(); return;
  }
  if((v=d('[data-cat]','cat'))){ cat=v; renderQs(); const on=$('.cat.on'); if(on) on.scrollIntoView({inline:'center',block:'nearest'}); return; }
  if((v=d('[data-flt]','flt'))){ flt=v; rr(); return; }
  if((v=d('[data-qview]','qview'))){ qview=v; render(); scrollTo(0,0); return; }
  if((v=d('[data-imode]','imode'))){ imode=v; rr(); return; }
  if((v=d('[data-company]','company'))){ cType=v; rr(); return; }
  if((v=d('[data-gstep]','gstep'))){
    if(v==='next') gi=Math.min(gi+1,GEN.length); else if(v==='prev') gi=Math.max(gi-1,0); else gi=0;
    render(); scrollTo(0,0); return;
  }
  if((v=d('[data-fact]','fact'))){
    if(v==='random'){ fMain=shuffle(allQs())[0].text; newFollow(); } else newFollow();
    rr(); return;
  }
  if((v=d('[data-pact]','pact'))){
    if(v==='next'){ const others=allQs().filter(q=>q.text!==pMain); pMain=shuffle(others)[0].text; pThread=[]; }
    else{ const unused=PRESS.filter(p=>!pThread.includes(p)); pThread.push(shuffle(unused.length?unused:PRESS)[0]); }
    rr(); return;
  }
  if((v=d('[data-add]','add'))){
    if(v==='open') addOpen=true;
    else if(v==='cancel') addOpen=false;
    else{
      const text=$('#aq').value.trim();
      if(!text){ $('#aq').focus(); return; }
      if(!allQs().some(q=>q.text===text)){
        S.custom.push({cat:$('#acat').value,text});
        S.lv[text]=+$('#alv').value; S.hot[text]=$('#ahot').checked; save();
      }
      addOpen=false; cat='전체'; flt='all';
    }
    rr(); return;
  }
  if(g('[data-more]')){ tab='qs'; qview='list'; document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab==='qs')); render(); scrollTo(0,0); return; }
  const tb=g('.tab');
  if(tb){ tabScroll[tab]=scrollY; tab=tb.dataset.tab; document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===tb)); render(); scrollTo(0,tabScroll[tab]||0); }
});
document.addEventListener('input',e=>{
  const m=e.target.closest('[data-memo-in]');
  if(m){ const t=m.dataset.memoIn; if(m.value.trim()) S.memo[t]=m.value; else delete S.memo[t]; save(); }
});
document.addEventListener('change',e=>{
  if(e.target.id==='fsel'){ fMain=e.target.value||null; if(fMain) newFollow(); rr(); }
});
$('#q').addEventListener('input',e=>{ query=e.target.value.trim(); render(); });


/* ---------- 계정 동기화 (db: 내 계정 전용 문서) ---------- */
let docRef=null, pushTimer=null, pushing=false, dirty=false, syncState='local';
const FIELDS=['favs','done','memo','lv','hot','custom'];
const body=()=>{ const o={_t:S._t||Date.now()}; FIELDS.forEach(k=>o[k]=S[k]); return JSON.parse(JSON.stringify(o)); };
function schedulePush(){ dirty=true; if(!docRef) return; clearTimeout(pushTimer); pushTimer=setTimeout(push,700); }
async function push(){
  if(!docRef||pushing||!dirty) return;
  pushing=true; dirty=false;
  try{ await docRef.set(body()); setSync('synced'); }
  catch(e){ dirty=true; setSync('error',(e&&(e.code||e.message))||''); }
  pushing=false;
  if(dirty) pushTimer=setTimeout(push,1500);
}
function setSync(v,detail){
  syncState=v; const el=$('#sync'); if(!el) return;
  const m={local:'동기화 연결 중…',synced:'☁ 계정에 저장됨 · 다른 브라우저에서도 보여요',error:'⚠ 저장 실패',off:'⚠ 이 브라우저에만 저장 중'};
  const bad=(v==='error'||v==='off');
  el.textContent=(m[v]||'')+(detail?' · '+detail:'')+(bad?' (눌러서 다시 시도)':'');
  if(bad) el.setAttribute('data-bad',''); else el.removeAttribute('data-bad');
}
/* 처음 연결할 때: 이 브라우저에만 있던 기존 메모를 잃지 않게 합치기 */
function mergeInto(local,remote){
  const m={favs:[...new Set([...(remote.favs||[]),...(local.favs||[])])],
    done:Object.assign({},local.done,remote.done),
    memo:Object.assign({},local.memo,remote.memo),
    lv:Object.assign({},local.lv,remote.lv),
    hot:Object.assign({},local.hot,remote.hot),
    custom:[...(remote.custom||[])]};
  (local.custom||[]).forEach(c=>{ if(!m.custom.some(x=>x.text===c.text)) m.custom.push(c); });
  Object.keys(local.memo||{}).forEach(t=>{ const a=(remote.memo||{})[t], b=local.memo[t]; if(a&&b&&a.trim()!==b.trim()) m.memo[t]=a+'\n---\n'+b; });
  return m;
}
const typing=()=>{ const a=document.activeElement; return a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT'); };
let unsub=null, initing=false;
async function initSync(){
  if(initing) return; initing=true;
  try{
    if(unsub){ try{unsub();}catch(e){} unsub=null; }
    docRef=null; setSync('local');
    if(typeof claude==='undefined'||!claude.use){ setSync('off','실행 환경을 찾을 수 없음'); return; }
    const db=await claude.use('db');
    if(!db){ setSync('off','db 연결 불가(로그인·권한 확인)'); return; }
    const user=await claude.use('user');
    const uid=user&&user.id?await user.id():null;
    if(!uid){ setSync('off','계정 정보를 확인할 수 없음'); return; }
    docRef=db.doc('data/users/'+uid+'/platform-interview');
    let firstLink=true; try{ firstLink=!localStorage.getItem('platform-interview-linked-'+uid); }catch(e){}
    let first=true;
    unsub=docRef.onSnapshot(snap=>{
      try{
        if(snap.metadata&&snap.metadata.hasPendingWrites) return;
        const r=snap.exists?snap.data():null;
        if(first){
          first=false;
          if(r){
            if(firstLink || !S._t){ Object.assign(S,mergeInto(S,r)); S._t=Date.now(); persistLocal(); dirty=true; }
            else if((r._t||0)>(S._t||0)){ FIELDS.forEach(k=>S[k]=r[k]!==undefined?r[k]:S[k]); S._t=r._t; persistLocal(); }
            else dirty=(r._t||0)<(S._t||0);
          }else dirty=true;
          try{ localStorage.setItem('platform-interview-linked-'+uid,'1'); }catch(e){}
          if(!typing()) rr();
          if(dirty) push(); else setSync('synced');
          return;
        }
        if(r && (r._t||0)>(S._t||0) && !pushing){
          FIELDS.forEach(k=>S[k]=r[k]!==undefined?r[k]:S[k]); S._t=r._t; persistLocal();
          if(!typing()) rr();
        }
      }catch(e){ setSync('error',(e&&e.message)||''); }
    },e=>setSync('off',(e&&(e.code||e.message))||'읽기 오류'));
  }catch(e){ setSync('off',(e&&(e.code||e.message))||'연결 오류'); }
  finally{ initing=false; }
}
document.addEventListener('click',e=>{ const el=e.target.closest('#sync[data-bad]'); if(el){ initSync(); } });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&dirty){ clearTimeout(pushTimer); push(); } });

document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===tab));
render();
setSync("local");
initSync();
</script>
